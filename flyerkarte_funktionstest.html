<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flyer-Challenge – Funktionstest</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:#f7f8fa;color:#17212f}header{padding:14px 16px;background:white;box-shadow:0 1px 5px #0002}h1{font-size:19px;margin:0 0 5px}small{color:#596579}.bar{height:10px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin:9px 0}.fill{height:100%;background:#E5484D;width:0}#map{height:calc(100dvh - 228px);min-height:310px}.controls{padding:10px 14px;background:white;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select,input{font:inherit;padding:9px;border:1px solid #ccd2d9;border-radius:9px;background:white}button{cursor:pointer}.primary{background:#17212f;color:white}button:disabled{opacity:.45}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle}.notice{font-size:12px;color:#596579;padding:5px 14px}.modal{position:fixed;inset:0;background:#0008;z-index:1000;display:none;align-items:end;justify-content:center}.panel{background:white;padding:22px;width:100%;max-width:480px;border-radius:18px 18px 0 0}.panel button{margin:5px}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;padding-top:7px}.leaflet-container{background:#e7edf0}</style></head><body><header><h1>🧪 Flyer-Challenge – Funktionstest</h1><small id="mode">Lokale Demo – Änderungen sind nicht mit anderen geteilt</small><div class="bar"><div class="fill" id="fill"></div></div><small id="progress">0 von 0 Abschnitten fertig</small><div class="legend"><span><i class="dot" style="background:#8B919A"></i> Offen</span><span><i class="dot" style="background:#FFD600"></i> In Bearbeitung</span><span><i class="dot" style="background:#E5484D"></i> Fertig</span></div></header><div class="controls"><select id="district"><option value="">Alle Stadtteile</option><option>Connewitz</option><option>Südvorstadt</option><option>Dölitz-Dösen</option><option>Lößnig</option><option>Marienbrunn</option></select><button id="login">Helfer-Anmeldung</button><button id="logout" hidden>Abmelden</button><span id="user"></span></div><div id="map"></div><div class="notice" id="notice">Prüfstand: Die Wohnstraßenauswahl und Abschnittsaufteilung sind noch nicht abschließend geprüft.</div><div class="modal" id="modal"><div class="panel"><strong id="street"></strong><p id="hint"></p><div id="choices"></div><button onclick="closePanel()">Schließen</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const COLORS={offen:'#8B919A',arbeit:'#FFD600',fertig:'#E5484D'};
const config=await fetch('./config.json').then(r=>r.json()).catch(()=>({}));
const live=!!(config.supabaseUrl&&config.supabaseAnonKey);const db=live?createClient(config.supabaseUrl,config.supabaseAnonKey):null;
const map=L.map('map').setView([51.307,12.378],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap-Mitwirkende',maxZoom:19}).addTo(map);
let features=[],layer,selected=null,session=null,allowed=false;
const example={type:'FeatureCollection',features:[{type:'Feature',properties:{id:'demo-1',name:'Beispielabschnitt A',district:'Südvorstadt',status:'offen'},geometry:{type:'LineString',coordinates:[[12.372,51.326],[12.3725,51.324]]}},{type:'Feature',properties:{id:'demo-2',name:'Beispielabschnitt B',district:'Connewitz',status:'arbeit'},geometry:{type:'LineString',coordinates:[[12.378,51.312],[12.380,51.311]]}},{type:'Feature',properties:{id:'demo-3',name:'Beispielabschnitt C',district:'Marienbrunn',status:'fertig'},geometry:{type:'LineString',coordinates:[[12.389,51.304],[12.390,51.302]]}}]};
let source=await fetch('./streets.geojson').then(r=>r.ok?r.json():null).catch(()=>null);if(!source?.features?.length){source=example;document.getElementById('notice').textContent='ACHTUNG: Die Straßen-Datei fehlt. Es werden nur 3 Demoabschnitte angezeigt.';}
features=source.features.filter(f=>f.geometry?.type==='LineString'&&f.properties?.id);
if(live){document.getElementById('mode').textContent='TESTSEITE – Änderungen werden in der echten Datenbank gespeichert';await refreshSession();const {data,error:readError}=await db.from('street_status').select('id,status');if(readError)document.getElementById('notice').textContent='Supabase-Lesefehler: '+readError.message;if(source===example)document.getElementById('notice').textContent='ACHTUNG: Die Straßen-Datei fehlt. Es werden nur 3 Demoabschnitte angezeigt.';for(const row of data||[]){const f=features.find(f=>f.properties.id===row.id);if(f)f.properties.status=row.status;}db.channel('status-updates').on('postgres_changes',{event:'*',schema:'public',table:'street_status'},async()=>{const {data}=await db.from('street_status').select('id,status');for(const row of data||[]){const f=features.find(f=>f.properties.id===row.id);if(f)f.properties.status=row.status;}draw();}).subscribe();}
else document.getElementById('login').hidden=true;
function draw(){if(layer)map.removeLayer(layer);const district=document.getElementById('district').value;const visible=features.filter(f=>!district||f.properties.district===district);layer=L.geoJSON({type:'FeatureCollection',features:visible},{style:f=>({color:COLORS[f.properties.status]||COLORS.offen,weight:9,opacity:.9}),onEachFeature:(f,l)=>l.on('click',()=>openPanel(f))}).addTo(map);const done=visible.filter(f=>f.properties.status==='fertig').length;document.getElementById('fill').style.width=(visible.length?done/visible.length*100:0)+'%';document.getElementById('progress').textContent=`${done} von ${visible.length} Abschnitten fertig (${visible.length?Math.round(done/visible.length*100):0} %) `;}
document.getElementById('district').onchange=()=>{draw();if(layer.getLayers().length)map.fitBounds(layer.getBounds().pad(.15));};
function openPanel(f){selected=f;document.getElementById('street').textContent=`${f.properties.name||'Straßenabschnitt'} · ${f.properties.district||''}`;document.getElementById('hint').textContent=live&&!allowed?'Nur freigeschaltete Helfer dürfen den Status ändern.':'Status wählen:';const choices=document.getElementById('choices');choices.replaceChildren();for(const [status,label] of [['offen','Noch nicht verteilt'],['arbeit','In Bearbeitung'],['fertig','Fertig verteilt']]){const b=document.createElement('button');b.textContent=label;b.style.borderLeft=`9px solid ${COLORS[status]}`;b.disabled=live&&!allowed;b.onclick=()=>changeStatus(status);choices.append(b);}document.getElementById('modal').style.display='flex';}
async function changeStatus(status){if(!selected)return;if(live){if(!allowed)return;const {error}=await db.from('street_status').upsert({id:selected.properties.id,status},{onConflict:'id'});if(error){alert('Speichern fehlgeschlagen: '+error.message);return;}}selected.properties.status=status;draw();closePanel();}
window.closePanel=()=>document.getElementById('modal').style.display='none';
async function refreshSession(){const {data:{session:s}}=await db.auth.getSession();session=s;allowed=false;if(s){const {data,error:editorError}=await db.from('editors').select('user_id').eq('user_id',s.user.id).maybeSingle();allowed=!!data;if(editorError)document.getElementById('notice').textContent='Berechtigungsprüfung fehlgeschlagen: '+editorError.message;}document.getElementById('user').textContent=s?(allowed?'✓ Freigeschaltet':'Nicht freigeschaltet'):'';document.getElementById('login').hidden=!!s;document.getElementById('logout').hidden=!s;}
document.getElementById('login').onclick=async()=>{const email=prompt('Deine freigeschaltete E-Mail-Adresse:');if(!email)return;const {error}=await db.auth.signInWithOtp({email:email.trim(),options:{emailRedirectTo:location.origin+location.pathname}});alert(error?'Fehler: '+error.message:'Prüfe dein E-Mail-Postfach für den Anmeldelink.');};document.getElementById('logout').onclick=async()=>{await db.auth.signOut();await refreshSession();};if(db)db.auth.onAuthStateChange(()=>setTimeout(refreshSession,0));draw();
</script></body></html>
